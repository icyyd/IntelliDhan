[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intellidhan"
version = "0.1.0"
description = "IntelliDhan trading-signal platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.package-dir]
intellidhan_schemas = "shared-schemas/intellidhan_schemas"
intellidhan_ingestor = "services/ingestor/intellidhan_ingestor"
intellidhan_analytics = "services/analytics/intellidhan_analytics"

[tool.setuptools]
packages = [
    "intellidhan_schemas",
    "intellidhan_ingestor",
    "intellidhan_ingestor.providers",
    "intellidhan_analytics",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits live network; excluded by default"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
