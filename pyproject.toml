[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intellidhan"
version = "0.1.0"
description = "IntelliDhan trading-signal platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "redis>=5.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Keep CI reproducible while the existing codebase is migrated to newer Ruff rules.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.4.10"]

[tool.setuptools.package-dir]
intellidhan_schemas = "shared-schemas/intellidhan_schemas"
intellidhan_ingestor = "services/ingestor/intellidhan_ingestor"
intellidhan_analytics = "services/analytics/intellidhan_analytics"
intellidhan_engine = "services/engine/intellidhan_engine"
intellidhan_learning = "services/learning/intellidhan_learning"
intellidhan_delivery = "services/delivery/intellidhan_delivery"
intellidhan_gateway = "services/gateway/intellidhan_gateway"

[tool.setuptools]
packages = [
    "intellidhan_schemas",
    "intellidhan_ingestor",
    "intellidhan_ingestor.providers",
    "intellidhan_analytics",
    "intellidhan_engine",
    "intellidhan_learning",
    "intellidhan_delivery",
    "intellidhan_gateway",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits live network; excluded by default"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
