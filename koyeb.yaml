# Koyeb deployment reference for the IntelliDhan gateway.
#
# Koyeb drives auto-deploys from its GitHub integration, not this file —
# this documents the exact settings to enter in the dashboard. Reuses the
# service originally configured for IntelliDhan-legacy (single Nano
# instance, port 8000, /api/health check) — repoint its GitHub source to
# this repo (icyyd/IntelliDhan) and this Dockerfile.
#
# ── Secrets to set in Koyeb dashboard → Service → Settings → Environment ──
#   DATABASE_URL           # required PostgreSQL DSN for deploy-durable state
#   INTELLIDHAN_OWNER_TOKEN # required, random value of at least 24 characters
#   AUTOTRADE_CONTROL_TOKEN # required only for agent/operator control endpoints
#   AUTOTRADE_AGENT_TOKEN   # required only for Claude intent claim/receipt endpoints
#   TELEGRAM_BOT_TOKEN     # optional — alerts print to Koyeb logs if unset
#   TELEGRAM_CHAT_ID       # optional — required alongside the token above
#
# PostgreSQL (or a separately configured mounted persistent path) is a release
# requirement. The default SQLite file is suitable for local work only and is
# lost when Koyeb replaces an ephemeral container. The production durability
# gate below accepts PostgreSQL automatically. Set INTELLIDHAN_PERSISTENT_STATE
# only for a SQLite path that is genuinely mounted and deployment-durable. Keep
# the service single-instance until the in-process signal orchestrator and rate
# limits move to shared coordination.

name: intellidhan
type: WEB

definition:
  # Single-instance by design: the live loop's orchestrator state is
  # in-memory and cannot be sharded across replicas.
  scalings:
    min: 1
    max: 1

  regions:
    - fra

  instance_types:
    - type: free      # Nano: 512 MB RAM, 0.1 vCPU, always-on on the free plan

  docker:
    dockerfile: Dockerfile

  ports:
    - port: 8000
      protocol: http

  health_checks:
    - type: http
      port: 8000
      path: /api/health
      interval_seconds: 30
      timeout_seconds: 5
      grace_period_seconds: 45
      healthy_threshold: 1
      unhealthy_threshold: 3

  env:
    - key: PORT
      value: "8000"
    - key: INTELLIDHAN_SECURE_COOKIE
      value: "true"
    - key: INTELLIDHAN_REQUIRE_DURABLE_STATE
      value: "true"
