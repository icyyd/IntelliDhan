autotrade:
  contract_version: "1.1"
  # OFF creates no execution intents. SHADOW records non-executable intents.
  # SUPERVISED requires approval per intent. ARMED is time-limited and lets
  # Codex claim eligible intents without per-order UI approval.
  mode: "OFF"
  armed_until: null
  min_confidence: 0.75
  max_dollar_risk_per_order: 250.0
  max_daily_dollar_risk: 500.0
  max_open_intents: 1
  # Exposure ceiling evaluated against a fresh Robinhood buying-power read.
  # Per-order risk controls remain authoritative and may size far below this.
  max_available_capital_fraction: 0.80
  allowed_symbols: []
  allowed_strategies: []
  allowed_modules: []
  allow_options: false
  require_explicit_calibration: true
  agent: codex
  revision: 1
  updated_at: "2026-07-12T00:00:00Z"
